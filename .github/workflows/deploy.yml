
name: Deploy Ezziyyani Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezziyyani-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build
        run: test -s dist/index.html

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Checking TCP connectivity on port 22..."
          if timeout 15 bash -c 'echo > /dev/tcp/$VPS_HOST/22'; then
            echo "SSH PORT REACHABLE"
          else
            echo "::error::SSH PORT UNREACHABLE"
            exit 1
          fi

      - name: Verify SSH authentication
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" "whoami"

      - name: Deploy build to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/ezziyyani-portfolio-deploy/"

      - name: Deploy CMS API to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          RSYNC_RSH="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          $SSH "${VPS_USER}@${VPS_HOST}" "mkdir -p /var/www/ezziyyani-cms/server /var/www/ezziyyani-cms/src /var/www/ezziyyani-cms/deploy"
          rsync -az --delete \
            --exclude node_modules --exclude data --exclude uploads --exclude .env \
            -e "$RSYNC_RSH" \
            server/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/ezziyyani-cms/server/"
          rsync -az --delete -R \
            -e "$RSYNC_RSH" \
            src/content src/data src/types src/utils deploy \
            "${VPS_USER}@${VPS_HOST}:/var/www/ezziyyani-cms/"

      - name: Install and start CMS API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" \
            "sed -i 's/\r$//' /var/www/ezziyyani-cms/deploy/*.sh /var/www/ezziyyani-cms/deploy/*.conf && chmod +x /var/www/ezziyyani-cms/deploy/*.sh"
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" \
            "$(printf 'ADMIN_EMAIL=%q ADMIN_PASSWORD=%q JWT_SECRET=%q CMS_ROOT=/var/www/ezziyyani-cms bash /var/www/ezziyyani-cms/deploy/setup-api.sh' "$ADMIN_EMAIL" "$ADMIN_PASSWORD" "$JWT_SECRET")"

      - name: Verify deployed files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" \
            "test -s /var/www/ezziyyani-portfolio-deploy/index.html && echo 'Frontend deployed'"
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" \
            "curl -fsS http://127.0.0.1:8787/api/health | grep -q '\"ok\"' && echo 'Local API healthy'"
          if curl -fsS https://ezziyyani.com/api/health | grep -q '"ok"'; then
            echo "Public API healthy"
          else
            echo "::error::https://ezziyyani.com/api/health n'est pas du JSON. nginx doit proxy /api vers 127.0.0.1:8787."
            curl -sS -D - -o /tmp/api-health.body https://ezziyyani.com/api/health | head -n 30
            exit 1
          fi

      - name: Cleanup SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
